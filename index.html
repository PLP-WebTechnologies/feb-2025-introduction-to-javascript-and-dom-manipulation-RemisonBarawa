<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript and DOM Manipulation</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>

    <header>
        <h1>Dynamic Content Example</h1>
    </header>

    <main>
        <div id="message-container">
            <p id="greeting">Hello there!</p>
        </div>

        <button id="changeTextButton">Change Greeting</button>

        <div id="style-element">
            This text will have its style changed.
        </div>

        <button id="changeStyleButton">Change Style</button>

        <div id="element-container">
            <p id="removable-paragraph">This paragraph can be removed.</p>
        </div>

        <button id="addElementButton">Add Element</button>
        <button id="removeElementButton">Remove Element</button>
    </main>

    <footer>
        <p>&copy; 2025 My Dynamic Webpage</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
